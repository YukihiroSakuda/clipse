[package]
name = "clipse"
version = "0.1.2"
edition = "2021"

[lib]
name = "clipse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Image encode/decode dominates capture latency; without optimization the dev
# build spends seconds PNG-compressing a 4K frame. Optimize just the image
# pipeline crates (and their compression backends) even in dev builds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
# Recording: per-frame buffer copies and color handling live in windows-capture;
# unoptimized they can't keep up with high-rate frame delivery (choppy output).
[profile.dev.package.windows-capture]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "time"] }
xcap = "0.0"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gif = "0.13"
parking_lot = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "1"
raw-window-handle = "0.6"
webview2-com = "0.38"
# Pinned to match the windows-core version webview2-com/tao actually resolve
# to in this dependency graph — our own `windows = "0.58"` pulls a different,
# semver-incompatible windows-core, and `Interface::cast` requires the exact
# same crate instance as the COM type it's called on.
windows-core = "0.61"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
