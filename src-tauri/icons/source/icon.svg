<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Indigo body: lighter top, deep indigo bottom -->
    <linearGradient id="indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
    <mask id="c-mask">
      <rect width="512" height="512" fill="white"/>
      <circle cx="400" cy="256" r="110" fill="black"/>
    </mask>
    <!-- Crescent = cutout-sized circle minus the same circle shifted right -->
    <mask id="crescent-mask">
      <circle cx="400" cy="256" r="96" fill="white"/>
      <circle cx="430" cy="256" r="96" fill="black"/>
    </mask>
  </defs>
  <g filter="url(#shadow)">
    <g mask="url(#c-mask)">
      <circle cx="256" cy="256" r="238" fill="url(#indigo)"/>
    </g>
    <!-- Yellow moon sliver floating inside the transparent cutout -->
    <g mask="url(#crescent-mask)">
      <rect x="290" y="146" width="220" height="220" fill="#FACC15"/>
    </g>
  </g>
</svg>
