<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Horizontal: left=blue, right=violet -->
    <linearGradient id="gradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F9EFF"/>
      <stop offset="100%" stop-color="#9B52F8"/>
    </linearGradient>
    <!-- Vertical overlay: top=light, bottom=dark -->
    <linearGradient id="gradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0D0030" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2A1880" flood-opacity="0.45"/>
    </filter>
    <mask id="c-mask">
      <rect width="512" height="512" fill="white"/>
      <circle cx="400" cy="256" r="110" fill="black"/>
    </mask>
  </defs>
  <!-- Outer group: shadow applied to masked C shape -->
  <g filter="url(#shadow)">
    <g mask="url(#c-mask)">
      <circle cx="256" cy="256" r="238" fill="url(#gradH)"/>
      <circle cx="256" cy="256" r="238" fill="url(#gradV)"/>
    </g>
  </g>
</svg>
